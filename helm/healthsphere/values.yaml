backend:
  replicaCount: 1

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

  image:
    repository: host.docker.internal:5100/healthsphere-backend
    tag: "1.0.49"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"


frontend:
  replicaCount: 1

  image:
    repository: host.docker.internal:5100/healthsphere-frontend
    tag: "1.0.50"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80
    targetPort: 80

  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"


database:
  existingSecret: healthsphere-healthsphere-secret
  keys:
    name: database-name
    username: database-username
    password: database-password


config:
  environment: development
